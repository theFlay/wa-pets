# When the maintainer adds the "approved" label to a community suggestion,
# apply it to the site data, rebuild, commit, and close the issue with a note.
# Only people with write access can add labels, so nothing publishes without review.
name: Apply community suggestion

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

# Its own queue: in a shared one, a waiting approval could be cancelled by a
# photo run queued behind it. tools/push.sh handles pushes that overlap.
concurrency:
  group: community
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'community')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      # The issue text is untrusted, so it's only read by the script from the
      # event file, never pasted into a shell command.
      - name: Apply the suggestion
        id: apply
        run: |
          set +e
          python3 tools/community.py "$GITHUB_EVENT_PATH" > result.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Check the site builds, then commit
        id: commit
        if: steps.apply.outputs.code == '0'
        run: |
          python3 src/build.py
          git add -A data/community data/hobby data/grown
          sh tools/push.sh "Apply community suggestion #${{ github.event.issue.number }}"
      - name: Reply on the issue
        if: always() && steps.apply.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CODE: ${{ steps.apply.outputs.code }}
          SAVED: ${{ steps.commit.outcome }}
        run: |
          if [ "$CODE" = "0" ] && [ "$SAVED" = "success" ]; then
            printf '%s\n\nIt will show on the site within a few minutes. Thanks for contributing!\n' "$(cat result.txt)" > reply.md
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" -F reply.md
            gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY"
          elif [ "$CODE" = "0" ]; then
            printf 'The suggestion was fine but saving it to the site failed. The maintainer can add the approved label again to retry.\n' > reply.md
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" -F reply.md
            gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --remove-label approved
          else
            printf '%s\n\nPlease edit the suggestion and the maintainer can approve it again.\n' "$(cat result.txt)" > reply.md
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" -F reply.md
            gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --remove-label approved
          fi
  deploy:
    needs: apply
    if: needs.apply.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
