# Once a week, re-download the official lists (WA Organism List, WA noxious
# and high-risk fish lists, Live Import List), commit if they changed, and
# redeploy the site.
name: Update official lists

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (11:17 Perth)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Download and parse the lists
        run: python3 tools/update_lists.py
      - name: Check the site still builds
        run: python3 src/build.py
      - name: Commit if anything changed
        id: push
        run: |
          git add -A data/lists data/sources
          sh tools/push.sh "Update official lists"
  deploy:
    needs: lists
    if: needs.lists.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
